<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verwaltung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <p class="eyebrow">Korrektur-Counter</p>
      <h1>Verwaltung</h1>
    </header>

    <section id="loginBox" class="card narrow">
      <h2>Anmeldung</h2>
      <form id="loginForm">
        <label>E-Mail <input id="email" type="email" required></label>
        <label>Passwort <input id="password" type="password" required></label>
        <button class="primary" type="submit">Anmelden</button>
        <p id="loginMessage" class="muted"></p>
      </form>
    </section>

    <section id="adminContent" class="hidden">
      <div class="card">
        <h3>Neuen Stapel anlegen</h3>
        <form id="addForm" class="form-grid">
          <label>Bezeichnung <input id="name" required placeholder="z. B. Klassenarbeit Deutsch"></label>
          <label>Klasse <input id="klasse" required placeholder="z. B. 10c"></label>
          <label><span id="gesamtLabel">Anzahl Arbeiten</span> <input id="gesamt" type="number" min="1" required></label>
          <div class="modus">
            <label class="radio"><input type="radio" name="modus" value="schueler" checked> Schülerweise</label>
            <label class="radio"><input type="radio" name="modus" value="aufgaben"> Aufgabenweise</label>
          </div>
          <button class="primary" type="submit">Hinzufügen</button>
        </form>
        <p id="adminMessage" class="muted"></p>
      </div>

      <div class="card">
        <h3>Deine Stapel <span class="muted">(oben = als Nächstes)</span></h3>
        <div id="adminList"></div>
      </div>

      <button id="logoutButton" class="secondary">Abmelden</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
